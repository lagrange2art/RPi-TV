name: RPiTV GitHub Pytest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-22.04

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: run tests
      run: python -m pytest
