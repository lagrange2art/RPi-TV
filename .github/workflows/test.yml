name: RPiTV GitHub Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: install package
      run: |
        python -m pip install --upgrade pip
        pip install .[test] || pip install . || pip install pytest

    - name: run tests
      run: |
        pytest
