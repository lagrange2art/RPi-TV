[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpitv"
version = "2.0.0"
description = "Raspberry Pi LED web app"
requires-python = ">=3.8"
dependencies = [
  "Flask",
  "zeroconf",
  "numpy<2",
  "matplotlib",
  "opencv-python-headless==4.11.0.86",
  "adafruit-blinka",
  "adafruit-circuitpython-neopixel",
  "ansi2html",
  "pyserial",
  "pytest",
  "pytest-cov",
]
[tool.setuptools.package-data]
rpitv = [
  "setup.json",
  "templates/*.html",
  "static/*",
  "arduino_pixel/*.ino",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
reportGeneralTypeIssues = false