[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpitv"
version = "2.0.0"
description = "Raspberry Pi LED web app"
requires-python = ">=3.8"
dependencies = [
  "Flask",
  "numpy",
  "matplotlib",
  "ansi2html",
  "pytest",
  "pytest-cov",
]
[tool.setuptools.package-data]
rpitv = [
  "templates/*.html",
  "static/*",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
reportGeneralTypeIssues = false