<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill strip / RPI TV</title>
<style id='compiled-css' type='text/css'>
.wrapper {
  display: flex;
}
.box {
  width: 60px;
  height: 60px;
  border-style: solid;
  border-color: white;
 }
.off {
  background: rgb(0,0,0);
}
.white {
  background: rgb(255,255,255);
}
.g00 {
  background: rgb(255,51,51);
}
.g01 {
  background: rgb(255,153,51);
}
.g02 {
  background: rgb(255,255,0);
}
.g03 {
  background: rgb(128,255,0);
}


.g10 {
  background: rgb(0,255,0);
}
.g11 {
  background: rgb(0,255,128);
}
.g12 {
  background: rgb(0,255,255);
}
.g13 {
  background: rgb(0, 128, 255);
}


.g20 {
  background: rgb(0,0,255);
}
.g21 {
  background: rgb(127,0,255);
}
.g22 {
  background: rgb(255,0,255);
}
.g23 {
  background: rgb(255,0,127);
}


</style>
</head>
<body>
<main class="app-shell">
<header class="page-header">
  <div>
    <p class="eyebrow">01 / Strip control</p>
    <h1>FILL STRIP</h1>
    <p>Set a color for the entire strip. Current signal: <strong>{{ name }}</strong></p>
    <form action="{{ name }}" method="POST">
      <label for="brightness">Brightness</label>

      <input
        id="brightness"
        type="range"
        name="Brightness"
        min="0"
        max="1"
        step="0.01"
        value="{{ brightness }}"
        oninput="brightnessValue.value = this.value"
        onchange="this.form.submit()"
      >

      <output id="brightnessValue">{{ brightness }}</output>
    </form>
  </div>
  <a class="back-link" href="/">Back to control</a>
</header>
<section class="panel">
<div class="wrapper">
  <h2>Current output</h2>
  <div class="box" style="background: rgb({{ name }})"></div>
</div>


<div class="wrapper">
  <a href='/fillstrip/0,0,0'><div class="box off"></div></a>
  <a href='/fillstrip/255,255,255'><div class="box white"></div></a>
  <a href='/fillstrip/255,51,51'><div class="box g00"></div></a>
  <a href='/fillstrip/255,153,51'><div class="box g01"></div></a>
  <a href='/fillstrip/255,255,0'><div class="box g02"></div></a>
  <a href='/fillstrip/128,255,0'><div class="box g03"></div></a>
  <a href='/fillstrip/0,255,0'><div class="box g10"></div></a>
  <a href='/fillstrip/0,255,128'><div class="box g11"></div></a>
  <a href='/fillstrip/0,255,255'><div class="box g12"></div></a>
  <a href='/fillstrip/0,128,255'><div class="box g13"></div></a>
  <a href='/fillstrip/0,0,255'><div class="box g20"></div></a>
  <a href='/fillstrip/127,0,255'><div class="box g21"></div></a>
  <a href='/fillstrip/255,0,255'><div class="box g22"></div></a>
  <a href='/fillstrip/255,0,127'><div class="box g23"></div></a>
  <a href="/fillstrip/255,128,128"><div class="box" style="background: rgb(255,128,128)"></div></a>
  <a href="/fillstrip/255,200,128"><div class="box" style="background: rgb(255,200,128)"></div></a>
  <a href="/fillstrip/128,255,128"><div class="box" style="background: rgb(128,255,128)"></div></a>
  <a href="/fillstrip/128,200,255"><div class="box" style="background: rgb(128,200,255)"></div></a>
  <a href="/fillstrip/128,0,0"><div class="box" style="background: rgb(128,0,0)"></div></a>
  <a href="/fillstrip/128,64,0"><div class="box" style="background: rgb(128,64,0)"></div></a>
  <a href="/fillstrip/0,128,64"><div class="box" style="background: rgb(0,128,64)"></div></a>
  <a href="/fillstrip/0,64,128"><div class="box" style="background: rgb(0,64,128)"></div></a>
  <a href="/fillstrip/255,128,0"><div class="box" style="background: rgb(255,128,0)"></div></a>
  <a href="/fillstrip/200,80,0"><div class="box" style="background: rgb(200,80,0)"></div></a>
  <a href="/fillstrip/128,64,128"><div class="box" style="background: rgb(128,64,128)"></div></a>
  <a href="/fillstrip/64,64,64"><div class="box" style="background: rgb(64,64,64)"></div></a>
</div>

<div class="continuous-picker">
  <label for="color-picker">Choose any color</label>
  <input id="color-picker" type="color" value="#ff0000">
  <button type="button" onclick="applyColor()">Apply</button>
</div>

<script>
function applyColor() {
  const hex = document.getElementById("color-picker").value;
  const red = parseInt(hex.slice(1, 3), 16);
  const green = parseInt(hex.slice(3, 5), 16);
  const blue = parseInt(hex.slice(5, 7), 16);

  window.location.href = `/fillstrip/${red},${green},${blue}`;
}
</script>

</section>
</main>
</body>
</html>
