<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill strip / RPI TV</title>
<style>
  .color-wheel-picker {
    display: grid;
    grid-template-columns: minmax(0, 300px) minmax(180px, 1fr);
    align-items: center;
    gap: 24px;
    margin-top: 24px;
  }

  .color-wheel-wrapper {
    position: relative;
    width: min(300px, 100%);
    aspect-ratio: 1;
  }

  #wheelCanvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    cursor: crosshair;
    touch-action: none;
  }

  .picker-cursor {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid #ffffff;
    outline: 1px solid #000000;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
  }

  .color-wheel-details {
    display: grid;
    justify-items: start;
    gap: 14px;
  }

  .color-wheel-details label {
    color: var(--muted, #8799a6);
    font-family: "SF Mono", "Cascadia Code", monospace;
    font-size: 0.8rem;
  }

  .color-wheel-preview {
    width: 72px;
    height: 48px;
    border: 1px solid rgba(255, 255, 255, 0.55);
  }

  .color-wheel-details output {
    color: var(--amber, #ffbf69);
    font-family: "SF Mono", "Cascadia Code", monospace;
  }

  @media (max-width: 620px) {
    .color-wheel-picker {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>
</head>
<body>
<main class="app-shell">
<header class="page-header">
  <div>
    <p class="eyebrow">01 / Strip control</p>
    <h1>FILL STRIP</h1>
    <p>Set a color for the entire strip. Current signal: <strong>{{ name }}</strong></p>
    <form action="{{ name }}" method="POST">
      <label for="brightness">Brightness</label>

      <input
        id="brightness"
        type="range"
        name="Brightness"
        min="0"
        max="1"
        step="0.01"
        value="{{ brightness }}"
        oninput="brightnessValue.value = this.value"
        onchange="this.form.submit()"
      >

      <output id="brightnessValue">{{ brightness }}</output>
    </form>
  </div>
  <a class="back-link" href="/fillstrip/0,0,0">Turn Off</a>
  <a class="back-link" href="/">Back to control</a>
</header>
<section class="panel">

<div class="color-wheel-picker" data-initial-color="{{ name|default('255,0,0') }}">
  <div class="color-wheel-wrapper">
    <canvas id="wheelCanvas" width="300" height="300" aria-label="Color wheel"></canvas>
    <div id="pickerCursor" class="picker-cursor" aria-hidden="true"></div>
  </div>
  <div class="color-wheel-details">
    <label for="colorWheelPreview">Selected color (RGB)</label>
    <div id="colorWheelPreview" class="color-wheel-preview" aria-hidden="true"></div>
    <output id="colorWheelValue" aria-live="polite"></output>
  </div>
</div>

{% include "_colorpicker.html" %}

</section>
</main>
</body>
</html>
