<form action="{{ url_for('setbrightness') }}" method="POST">
    <input type="hidden" name="next" value="{{ request.full_path }}">
    <label for="brightness">Brightness</label>

    <input
    id="brightness"
    type="range"
    name="Brightness"
    min="0"
    max="1"
    step="0.01"
    value="{{ brightness }}"
    oninput="brightnessValue.value = this.value"
    onchange="this.form.submit()"
    >

    <output id="brightnessValue">{{ brightness }}</output>
</form>
